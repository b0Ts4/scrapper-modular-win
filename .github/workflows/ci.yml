name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: SDK version
        run: dotnet --version

      - name: OCR languages available on the runner
        shell: powershell
        run: |
          $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
          "Recognizer languages: " + (([Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }) -join ', ')
          Get-WindowsCapability -Online -Name 'Language.OCR*' | Where-Object { $_.Name -match 'en-US|pt-BR' } | Format-Table Name, State -AutoSize | Out-String -Width 200

      - name: Restore
        run: dotnet restore Prescriva.Agent.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build Prescriva.Agent.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test Prescriva.Agent.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~Prescriva.Agent.Windows.IntegrationTests"
          --blame-hang-timeout 5m --logger "trx;LogFilePrefix=unit" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Windows UI Automation integration tests
        if: always()
        env:
          PRESCRIVA_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/screenshots
        run: >
          dotnet test tests/Prescriva.Agent.Windows.IntegrationTests --configuration Release --no-build
          --filter "Category!=Packaged&Category!=StoreScreenshots"
          --blame-hang-timeout 5m --logger "trx;LogFilePrefix=integration" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Build, sign (test certificate) and install the MSIX package
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Prescriva Agent Dev" -KeyUsage DigitalSignature `
            -FriendlyName "Prescriva Agent test signing" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "prescriva-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test-signing.pfx" -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test-signing.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test-signing.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          ./packaging/build-msix.ps1 -Version "1.0.$env:GITHUB_RUN_NUMBER.0" -PfxPath "$env:RUNNER_TEMP\test-signing.pfx" -PfxPassword "prescriva-test"
          Copy-Item "$env:RUNNER_TEMP\test-signing.cer" out/msix/PrescrivaAgent-test-signing.cer
          $msix = Get-ChildItem out/msix/*.msix | Select-Object -First 1
          Add-AppxPackage -Path $msix.FullName
          $family = (Get-AppxPackage -Name "PrescrivaAgent.Dev").PackageFamilyName
          if (-not $family) { throw "The MSIX package did not install." }
          "PRESCRIVA_PACKAGE_FAMILY_NAME=$family" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Packaged Agent tests (installed MSIX)
        if: always()
        run: >
          dotnet test tests/Prescriva.Agent.Windows.IntegrationTests --configuration Release --no-build
          --filter "Category=Packaged"
          --blame-hang-timeout 5m --logger "trx;LogFilePrefix=packaged" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Build the Microsoft Store package (Partner Center identity, unsigned)
        if: always()
        shell: powershell
        run: ./packaging/build-msix.ps1 -Store -Version "1.0.$env:GITHUB_RUN_NUMBER.0" -Output out/msix-store

      - name: Upload the Microsoft Store package (submit this one in Partner Center)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: out/msix-store/*.msix
          if-no-files-found: error

      - name: Upload the MSIX package (test-signed, for sideload checks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: |
            out/msix/*.msix
            out/msix/*.cer
          if-no-files-found: warn

      - name: Publish a 32-bit TestTarget
        if: always()
        run: >
          dotnet publish src/Prescriva.Agent.TestTarget --configuration Release
          --runtime win-x86 --self-contained true -p:PlatformTarget=x86
          --output ${{ github.workspace }}/out/testtarget-x86

      - name: Windows UI Automation tests against the 32-bit TestTarget
        if: always()
        env:
          PRESCRIVA_TESTTARGET_EXE: ${{ github.workspace }}/out/testtarget-x86/Prescriva.Agent.TestTarget.exe
          PRESCRIVA_TESTTARGET_EXPECTED_BITNESS: "32"
        run: >
          dotnet test tests/Prescriva.Agent.Windows.IntegrationTests --configuration Release --no-build
          --filter "FullyQualifiedName~TestTargetSmokeTests|FullyQualifiedName~SelectorResolutionTests|FullyQualifiedName~CaptureProviderTests|FullyQualifiedName~TriggerProviderTests|FullyQualifiedName~ElementInspectionTests|FullyQualifiedName~MilestoneFlowTests|FullyQualifiedName~ProcessIdentityDiscoveryTests"
          --blame-hang-timeout 5m --logger "trx;LogFilePrefix=integration-x86" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Microsoft Store listing screenshots (1920x1080)
        if: always()
        shell: powershell
        env:
          PRESCRIVA_SCREENSHOT_DIR: ${{ github.workspace }}/out/store-screenshots
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Output "Set-DisplayResolution failed: $_" }
          dotnet test tests/Prescriva.Agent.Windows.IntegrationTests --configuration Release --no-build --filter "Category=StoreScreenshots" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Small JPEG previews in the log, for reviewers who cannot download artifacts.
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem "$env:PRESCRIVA_SCREENSHOT_DIR/store-*.png" -Exclude *-crop.png | ForEach-Object {
            $image = [System.Drawing.Image]::FromFile($_.FullName)
            $preview = New-Object System.Drawing.Bitmap $image, 800, ([int](800 * $image.Height / $image.Width))
            $stream = New-Object System.IO.MemoryStream
            $preview.Save($stream, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Output "===BEGIN $($_.BaseName) $($image.Width)x$($image.Height)==="
            Write-Output ([Convert]::ToBase64String($stream.ToArray()))
            Write-Output "===END $($_.BaseName)==="
            $preview.Dispose(); $image.Dispose()
            Write-Output "===BEGIN-FULL $($_.BaseName)==="
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))
            Write-Output "===END-FULL $($_.BaseName)==="
          }

      - name: Upload the Microsoft Store listing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            out/store-screenshots/store-*.png
            !out/store-screenshots/*-crop.png
          if-no-files-found: warn

      - name: Print hover screenshots (base64 crops, for reviewers without artifact access)
        if: always()
        shell: pwsh
        run: |
          foreach ($name in 'hover-MedicationTextBox-crop', 'hover-AddButton-crop') {
            $path = Join-Path $env:GITHUB_WORKSPACE "TestResults/screenshots/$name.png"
            if (Test-Path $path) {
              Write-Output "===BEGIN $name==="
              Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($path)))
              Write-Output "===END $name==="
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
